name: Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pin the linter version so CI results are reproducible: an
          # unpinned "latest" silently changes which linters/rules run and
          # can turn CI red on an unrelated PR (as goconst did on v2.12.2).
          version: v2.12.2
          args: --timeout=5m ./...
